<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picore — Animated artwork</title>
  <style>
    :root {
      color-scheme: dark;
      background: #141317;
      color: #ded9de;
      font: 100% / 1.7 system-ui, sans-serif;
    }

    body {
      margin: 0;
    }

    main {
      max-width: 44rem;
      margin-inline: auto;
      padding: clamp(2.5rem, 8vw, 6rem) 1.25rem;
    }

    h1, h2, p {
      margin: 0;
    }

    h1 {
      color: #fff7f4;
      font-size: clamp(3rem, 10vw, 5.25rem);
      line-height: 1;
      letter-spacing: -.055em;
    }

    h1 + p {
      max-width: 44ch;
      margin-top: 1rem;
      font-size: clamp(1.1rem, 3vw, 1.3rem);
    }

    h2 {
      margin: 2.75rem 0 .85rem;
      padding-top: 1rem;
      border-top: 1px solid #41373e;
      color: #fff7f4;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    p + p {
      margin-top: 1rem;
    }

    a, code {
      color: #ffc1ae;
    }

    code {
      font: .9em ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    pre, ul {
      margin: 0 0 1rem;
      border: 1px solid #41373e;
      border-radius: .65rem;
      background: #201b20;
    }

    pre {
      padding: .85rem 1rem;
      border-inline-start: 3px solid #f9977d;
      white-space: pre-wrap;
    }

    ul {
      padding: .2rem 1rem .2rem 2.15rem;
    }

    li {
      padding-block: .45rem;
    }

    li + li {
      border-top: 1px solid #41373e;
    }

    li::marker {
      color: #f9977d;
    }
  </style>
</head>
<body>
  <main>
    <!-- README -->
  </main>
</body>
</html>
